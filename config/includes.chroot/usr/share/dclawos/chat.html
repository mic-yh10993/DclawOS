<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 聊天</title>
<style>
/* Phase 6 M3 chat page. The 10 iron rules are executed verbatim
   in their native web form (docs/UI-RULES.md):
   1 no borders, 1-3% lightness layers, palette tokens below, no
     pure black anywhere;
   2 focus: no outline, deepened double-ring box-shadow;
   3 dark: font weights -40 (400->360, 600->560);
   4 streaming type: each new character runs a 90ms blur(6px) ->
     clear reveal with cubic-bezier(.215,.61,.355,1), neighbours
     staggered by 30ms (see @keyframes reveal + .rv spans below);
   5 inline icons vertical-align:-0.125em;
   6 tabular-nums for numbers; 7 Grid 0fr->1fr folds;
   8 text-wrap:pretty; 9 overdamped settle transitions +
     underdamped success pulse; 10 feedback self-extinguishes
     after 2.5s (copy check + toast timers). */
:root{
  --layer0:#f5f5f3; --layer1:#fcfcfb; --layer2:#fcfcfb; --layer3:#f5f5f3;
  --ink:#1a1a19; --ink-dim:rgba(32,32,30,.65); --accent:#3d5a80;
  --ring:rgba(61,90,128,.28); --ok:#2e7d4f; --bad:#b3402e;
  --hairline:rgba(26,26,25,.08);
}
body.dark{
  --layer0:#0b0b0a; --layer1:#151515; --layer2:#1a1a19; --layer3:#20201e;
  --ink:#f5f5f3; --ink-dim:rgba(245,245,243,.65);
  --hairline:rgba(245,245,243,.09);
  font-weight:360;
}
body.dark h1,body.dark h2,body.dark button{font-weight:560}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--layer0); color:var(--ink);
  font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;
  font-size:14px; line-height:1.55; display:flex; flex-direction:column;
}
h1{font-size:17px;font-weight:600;margin:0}
p,.prose{text-wrap:pretty;max-width:68ch}
.dim{color:var(--ink-dim)} .small{font-size:12.5px}
.num,.numeric{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
svg.ic{vertical-align:-0.125em;width:1em;height:1em}
button{
  background:var(--layer3); color:var(--ink); border:none; border-radius:8px;
  padding:6px 12px; font:inherit; font-weight:600; cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--hairline);
  transition:transform .18s cubic-bezier(.215,.61,.355,1), opacity .25s cubic-bezier(.215,.61,.355,1);
}
button.primary{background:var(--accent);color:#fcfcfb}
button.danger{background:var(--bad);color:#fcfcfb}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{
  background:var(--layer2); color:var(--ink); border:none; border-radius:8px;
  padding:7px 9px; font:inherit;
  box-shadow:inset 0 0 0 1px var(--hairline);
}
input:focus,select:focus,textarea:focus,button:focus{
  outline:none;
  box-shadow:inset 0 0 0 1px var(--accent), 0 0 0 3px var(--ring);
}
header.chathead{
  background:var(--layer1); padding:10px 16px; display:flex;
  align-items:center; gap:10px; flex-wrap:wrap;
  box-shadow:inset 0 -1px var(--hairline);
}
header.chathead .spacer{flex:1 1 auto}
#banner{
  background:var(--layer2); color:var(--ink); padding:8px 16px;
  box-shadow:inset 0 -1px var(--hairline); display:none;
}
#layout{flex:1 1 auto; display:flex; min-height:0}
aside#sessions{
  width:200px; flex:0 0 200px; background:var(--layer1); padding:10px;
  box-shadow:inset -1px 0 var(--hairline); overflow-y:auto;
}
aside#sessions .sess{
  display:block; width:100%; text-align:left; margin:0 0 4px;
  background:var(--layer2); font-weight:400;
}
aside#sessions .sess.sel{box-shadow:inset 0 0 0 1px var(--accent), 0 0 0 3px var(--ring)}
main#main{flex:1 1 auto; display:flex; flex-direction:column; min-width:0}
#msgs{flex:1 1 auto; overflow-y:auto; padding:14px 16px}
.msg{max-width:72ch; margin:0 0 10px; padding:9px 12px; border-radius:12px;
  background:var(--layer1); box-shadow:inset 0 0 0 1px var(--hairline);
  text-wrap:pretty; white-space:pre-wrap; word-break:break-word}
.msg.user{background:var(--layer2); margin-left:auto}
.msg.sys{background:transparent; box-shadow:none; color:var(--ink-dim);
  font-size:12.5px; padding:2px 4px}
.msg .who{font-size:12px; color:var(--ink-dim); margin:0 0 2px}
.msg .copybtn{float:right; padding:2px 9px; font-size:12px}
.stepcard,.approvalcard{
  max-width:72ch; margin:0 0 10px; padding:9px 12px; border-radius:12px;
  background:var(--layer2); box-shadow:inset 0 0 0 1px var(--hairline);
  text-wrap:pretty;
}
.stepcard pre{
  margin:6px 0 0; max-height:180px; overflow-y:auto; white-space:pre-wrap;
  font-size:12.5px; font-variant-numeric:tabular-nums;
}
.approvalcard .risk{color:var(--bad)}
.approvalcard pre{margin:6px 0; white-space:pre-wrap; font-size:12.5px}
@keyframes reveal{
  from{filter:blur(6px); opacity:.25}
  to{filter:blur(0); opacity:1}
}
.rv{animation:reveal 90ms cubic-bezier(.215,.61,.355,1) both}
#composer{padding:10px 16px; background:var(--layer1);
  box-shadow:inset 0 1px var(--hairline)}
#composer .row{display:flex; gap:8px; align-items:flex-end}
#input{flex:1 1 auto; resize:none}
.fold{display:grid; grid-template-rows:0fr;
  transition:grid-template-rows .25s cubic-bezier(.215,.61,.355,1)}
.fold.open{grid-template-rows:1fr}
.fold > .foldinner{overflow:hidden; min-height:0}
#assignform .row{margin:8px 0 0}
#assignform input,#assignform textarea{width:100%}
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--layer3); color:var(--ink); padding:8px 18px;
  border-radius:99px; opacity:0; pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--hairline), 0 6px 24px rgba(26,26,25,.18);
  transition:opacity .25s cubic-bezier(.215,.61,.355,1);
  max-width:86vw; text-wrap:pretty;
}
#toast.show{opacity:1}
#toast.pulse{animation:pulse .38s cubic-bezier(.34,1.8,.64,1)}
@keyframes pulse{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1)}}
.err{color:var(--bad)} .ok{color:var(--ok)}
</style>
</head>
<body>
<header class="chathead">
  <h1>AI 聊天</h1>
  <span id="connstate" class="small dim">正在连接宿主…</span>
  <span class="spacer"></span>
  <label class="small dim" for="provsel">供应商</label>
  <select id="provsel"></select>
  <label class="small dim" for="modelsel">模型</label>
  <select id="modelsel"></select>
  <span id="modelstate" class="small dim"></span>
  <button id="dashbtn" type="button">打开看板</button>
  <button id="monbtn" type="button">监视 AI</button>
  <button id="setbtn" type="button">设置</button>
</header>
<div id="banner" class="small"></div>
<div id="layout">
  <aside id="sessions">
    <button id="newsess" type="button" class="primary" style="width:100%;margin:0 0 8px">＋ 新建会话</button>
    <div id="sesslist"></div>
  </aside>
  <main id="main">
    <div id="msgs"></div>
    <div id="composer">
      <div class="fold" id="assignfold"><div class="foldinner">
        <div id="assignform">
          <div class="row"><input id="as-title" placeholder="任务标题"></div>
          <div class="row"><input id="as-goal" placeholder="任务目标"></div>
          <div class="row"><textarea id="as-steps" rows="3" placeholder='步骤（JSON 数组，如 [{"tool": "shell", "params": {"argv": ["ls"]}}]）'></textarea></div>
          <div class="row"><button id="as-submit" type="button" class="primary">创建指派任务</button>
          <span id="as-msg" class="small"></span></div>
        </div>
      </div></div>
      <div class="row">
        <textarea id="input" rows="2" placeholder="输入消息或 /命令……（/help 看命令，Enter 发送）"></textarea>
        <button id="assignbtn" type="button">指派任务…</button>
        <button id="stopbtn" type="button" class="danger">停止</button>
        <button id="sendbtn" type="button" class="primary">发送</button>
      </div>
    </div>
  </main>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* Host bridge: the page is untrusted content; it only sends typed
   command envelopes and receives replies/events. No eval. */
const pending = new Map();
let seq = 0;
function post(obj){
  const text = JSON.stringify(obj);
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dclawos){
    window.webkit.messageHandlers.dclawos.postMessage(text);
  } else if (window.__dclawosHostPost){
    window.__dclawosHostPost(text);
  }
}
function send(command, params){
  return new Promise((resolve, reject) => {
    const id = "r" + (++seq);
    pending.set(id, {resolve, reject});
    post({kind:"command", protocol:1, id:id, command:command, params:params||{}});
  });
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastTimer = null;
function toast(text, ok){
  const el = document.getElementById("toast");
  el.textContent = (ok === false ? "✗ " : "✓ ") + text;
  el.classList.add("show");
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 2500);
}

const msgs = document.getElementById("msgs");
let currentSession = null;
let catalog = [];
let streamBubbles = new Map();  // task_id -> {el, bodyEl, text}
let stepCards = new Map();      // task_id:step -> card elements
let lastReply = "";

function scrollEnd(){ msgs.scrollTop = msgs.scrollHeight; }
function addMsg(cls, who, text){
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (who){
    const w = document.createElement("div"); w.className = "who";
    w.textContent = who; div.appendChild(w);
  }
  const body = document.createElement("span"); body.textContent = text;
  div.appendChild(body);
  msgs.appendChild(div); scrollEnd();
  return {el: div, bodyEl: body};
}
function addUser(text){ addMsg("user", "你", text); }
function addSystem(text){ addMsg("sys", "", text); }

/* Iron rule 4 reveal: ONLY the newly appended text is animated.
   Each character becomes one span with the 90ms blur reveal and a
   30ms stagger (cycled every 24 chars so a long delta never waits
   seconds to start); previously rendered nodes are untouched, so
   streaming never reflows the whole reply. */
function appendReveal(bodyEl, text){
  const frag = document.createDocumentFragment();
  let i = 0;
  for (const ch of text){
    const span = document.createElement("span");
    span.className = "rv";
    span.style.animationDelay = ((i % 24) * 30) + "ms";
    span.textContent = ch;
    frag.appendChild(span);
    i++;
  }
  bodyEl.appendChild(frag);
  scrollEnd();
}
function attachCopy(msg, text){
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "copybtn"; btn.textContent = "复制";
  btn.addEventListener("click", async () => {
    try {
      await send("chat.copy", {text: text});
      const old = btn.textContent;
      btn.textContent = "✓ 已复制";
      setTimeout(() => { btn.textContent = old; }, 2500);
    } catch(e){ toast("复制失败：" + e.message, false); }
  });
  msg.el.insertBefore(btn, msg.el.firstChild);
}
function bubbleFor(taskId){
  let b = streamBubbles.get(taskId);
  if (b) return b;
  const m = addMsg("ai", "AI", "");
  b = {el: m.el, bodyEl: m.bodyEl, text: ""};
  streamBubbles.set(taskId, b);
  return b;
}
function onDelta(taskId, text, mode){
  const b = bubbleFor(taskId);
  b.text += text;
  appendReveal(b.bodyEl, text);
}
function reconcileTask(data){
  const taskId = data.task_id;
  const b = streamBubbles.get(taskId);
  const result = data.result || {};
  if (data.status === "done" && data.kind === "llm"){
    if (result.reply != null){
      lastReply = result.reply;
      if (b){
        /* Reconcile against the final reply: REPLACE the streamed
           text with result.reply (never append a second copy). */
        b.bodyEl.textContent = result.reply;
        attachCopy(b, result.reply);
        streamBubbles.delete(taskId);
      } else {
        /* Staged path (no deltas arrived, e.g. claude format):
           render the whole reply with the rule-4 staged reveal. */
        const m = addMsg("ai", "AI", "");
        appendReveal(m.bodyEl, result.reply);
        attachCopy(m, result.reply);
      }
      if (result.stream_mode === "staged"){
        addSystem("本条回复为分阶段显现（非供应商流式）。");
      }
      return;
    }
    if (result.model_configured === false){
      addSystem("未配置供应商密钥，本条消息已如实记录，没有生成模型回答。");
      streamBubbles.delete(taskId);
      return;
    }
    addSystem("任务完成（无回复文本）。");
    streamBubbles.delete(taskId);
    return;
  }
  if (data.status === "done"){
    const shown = esc(JSON.stringify(result).slice(0, 400));
    addSystem("任务完成 [" + (data.title || taskId) + "]：" + shown);
  } else {
    let note = "任务 " + data.status + " [" + (data.title || taskId) + "]";
    if (data.error) note += "：" + data.error;
    if (result.partial) note += "（已显示的部分内容为流式中断前的片段）";
    addSystem(note);
  }
  streamBubbles.delete(taskId);
}
function stepCard(taskId, step, tool){
  const key = taskId + ":" + (step == null ? "?" : step);
  let card = stepCards.get(key);
  if (card) return card;
  const div = document.createElement("div");
  div.className = "stepcard";
  div.innerHTML = '<div class="who">工具步骤 · <span class="toolname"></span> ' +
    '<span class="st dim small">运行中…</span></div><pre></pre>';
  div.querySelector(".toolname").textContent = tool || "shell";
  msgs.appendChild(div); scrollEnd();
  card = {el: div, pre: div.querySelector("pre"),
          st: div.querySelector(".st")};
  stepCards.set(key, card);
  return card;
}
function onCommandOutput(etype, inner, summary){
  const taskId = inner.task_id || "";
  if (etype === "command"){
    const card = stepCard(taskId, inner.step, inner.tool);
    if (inner.phase === "finish") card.st.textContent = "已结束";
    return;
  }
  if (etype === "output"){
    const card = stepCard(taskId, inner.step, inner.tool);
    card.pre.textContent += inner.chunk || "";
    scrollEnd();
  }
}
function onApproval(data){
  if (!data || !data.ticket_id) return;
  const id = "appr-" + data.ticket_id;
  let card = document.getElementById(id);
  if (data.status && data.status !== "pending"){
    if (card){
      const st = card.querySelector(".apst");
      if (st) st.textContent = data.status === "approved" ? "已批准" : "已拒绝";
      card.querySelectorAll("button").forEach(b => { b.disabled = true; });
    }
    return;
  }
  if (card) return;
  card = document.createElement("div");
  card.className = "approvalcard"; card.id = id;
  const tier = data.tier == null ? "?" : data.tier;
  card.innerHTML =
    '<div class="who">审批请求 · 工具 <strong class="t"></strong> · ' +
    '<span class="risk">tier <span class="n num"></span></span> · ' +
    '<span class="apst dim">待审批</span></div>' +
    '<div class="sum prose"></div><pre class="params"></pre>' +
    '<button type="button" class="primary okbtn">批准</button> ' +
    '<button type="button" class="danger denybtn">拒绝</button>';
  card.querySelector(".t").textContent = data.tool || "";
  card.querySelector(".n").textContent = tier;
  card.querySelector(".sum").textContent = data.summary || "";
  card.querySelector(".params").textContent =
    JSON.stringify(data.params || {}, null, 1).slice(0, 600);
  const verdict = async (verb, label) => {
    try {
      await send(verb, {ticket_id: data.ticket_id});
      card.querySelector(".apst").textContent = label;
      card.querySelectorAll("button").forEach(b => { b.disabled = true; });
      toast("票据" + label);
    } catch(e){ toast("裁决失败：" + e.message, false); }
  };
  card.querySelector(".okbtn").addEventListener("click",
    () => verdict("chat.approve", "已批准"));
  card.querySelector(".denybtn").addEventListener("click",
    () => verdict("chat.deny", "已拒绝"));
  msgs.appendChild(card); scrollEnd();
}

function renderSessions(sessions){
  const list = document.getElementById("sesslist");
  list.innerHTML = "";
  for (const s of sessions || []){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sess" + (s.id === currentSession ? " sel" : "");
    b.textContent = (s.title || "会话") + " · " + String(s.id).slice(0, 6);
    b.addEventListener("click", async () => {
      try {
        const r = await send("chat.switch", {session: s.id});
        currentSession = r.session;
        renderHistory(r.messages || []);
        await refreshState(false);
      } catch(e){ toast("切换失败：" + e.message, false); }
    });
    list.appendChild(b);
  }
}
function renderHistory(history){
  msgs.innerHTML = "";
  streamBubbles.clear(); stepCards.clear();
  for (const m of history){
    if (m.role === "user") addUser(m.content);
    else {
      const msg = addMsg("ai", "AI", m.content);
      attachCopy(msg, m.content);
      lastReply = m.content;
    }
  }
}
function renderModel(model){
  catalog = model.providers || [];
  const prov = document.getElementById("provsel");
  const cur = prov.value;
  prov.innerHTML = "";
  for (const p of catalog){
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.id + (p.key_configured ? "" : "（未配置密钥）");
    prov.appendChild(o);
  }
  prov.value = model.provider || cur || "";
  fillModels(model.model || "");
  document.getElementById("modelstate").textContent =
    model.provider ? ("当前：" + model.provider + " / " + (model.model || "自动")) : "未设置默认模型";
  const banner = document.getElementById("banner");
  if (!model.configured){
    banner.style.display = "block";
    banner.textContent = "未配置任何供应商密钥：仍可发消息，任务会如实记录且不生成模型回答；在「设置 → 模型设置」保存 llm-<供应商> 密钥后生效。";
  } else {
    banner.style.display = "none";
  }
}
function fillModels(current){
  const sel = document.getElementById("modelsel");
  const prov = document.getElementById("provsel").value;
  const entry = catalog.find(p => p.id === prov);
  sel.innerHTML = "";
  const auto = document.createElement("option");
  auto.value = ""; auto.textContent = "（自动）"; sel.appendChild(auto);
  for (const m of (entry ? entry.models : [])){
    const o = document.createElement("option");
    o.value = m.id; o.textContent = m.id; sel.appendChild(o);
  }
  sel.value = current || "";
}
async function refreshState(renderHist = true){
  const st = await send("chat.state", {});
  currentSession = st.current_session;
  renderSessions(st.sessions || []);
  if (renderHist) renderHistory(st.messages || []);
  renderModel(st.model || {});
  for (const card of st.approvals || []) onApproval(card);
  return st;
}

window.__dclawosReceive = function(msg){
  if (!msg || typeof msg !== "object") return;
  if (msg.kind === "hello_ack"){
    document.getElementById("connstate").textContent =
      "宿主桥已连接（协议 v" + msg.protocol + "）";
    refreshState(true).catch(e => toast("加载失败：" + e.message, false));
    return;
  }
  if (msg.kind === "reply" || msg.kind === "error"){
    const p = pending.get(msg.id);
    if (!p) return;
    pending.delete(msg.id);
    if (msg.kind === "error") p.reject(new Error((msg.error && msg.error.message) || "宿主错误"));
    else p.resolve(msg.result || {});
    return;
  }
  if (msg.kind === "event"){
    const d = msg.data || {};
    if (msg.type === "chat.task_done"){ reconcileTask(d); return; }
    if (msg.type === "approval"){ onApproval(d); return; }
    const inner = d.data || {};
    if (msg.type === "llm"){
      if (inner.delta) onDelta(d.task_id || inner.task_id || "", inner.delta, inner.stream_mode);
      return;
    }
    if (msg.type === "command" || msg.type === "output"){
      onCommandOutput(msg.type, inner, d.summary);
      return;
    }
    if (msg.type === "settings" || msg.type === "model"){
      refreshState(false).catch(() => {});
    }
  }
};

async function doSend(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addUser(text);
  const btn = document.getElementById("sendbtn");
  btn.disabled = true;
  try {
    const r = await send("chat.send", {text: text});
    if (r.action === "reply") addSystem(r.text || "");
  } catch(e){ addSystem("发送失败：" + e.message); }
  btn.disabled = false;
}
document.getElementById("sendbtn").addEventListener("click", doSend);
document.getElementById("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); doSend(); }
});
document.getElementById("stopbtn").addEventListener("click", async () => {
  try {
    const r = await send("chat.stop", {});
    addSystem(r.message || "已请求停止");
  } catch(e){ toast("停止失败：" + e.message, false); }
});
document.getElementById("assignbtn").addEventListener("click", () => {
  document.getElementById("assignfold").classList.toggle("open");
});
document.getElementById("as-submit").addEventListener("click", async () => {
  const msgEl = document.getElementById("as-msg");
  let steps = [];
  const raw = document.getElementById("as-steps").value.trim();
  try { steps = raw ? JSON.parse(raw) : []; }
  catch(e){ msgEl.innerHTML = '<span class="err">步骤 JSON 无效：' + esc(e.message) + '</span>'; return; }
  try {
    const r = await send("chat.assign", {
      title: document.getElementById("as-title").value.trim() || "指派任务",
      goal: document.getElementById("as-goal").value.trim(),
      steps: steps});
    addSystem("已创建指派任务：" + (r.title || "") + "（" + r.task_id + "）");
    document.getElementById("assignfold").classList.remove("open");
    toast("指派任务已创建");
  } catch(e){ msgEl.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
});
document.getElementById("newsess").addEventListener("click", async () => {
  try {
    const r = await send("chat.new", {});
    currentSession = r.session;
    renderHistory([]);
    await refreshState(false);
    toast("已新建会话");
  } catch(e){ toast("新建失败：" + e.message, false); }
});
document.getElementById("provsel").addEventListener("change", () => fillModels(""));
async function applyModel(){
  try {
    const r = await send("chat.model.set", {
      provider: document.getElementById("provsel").value,
      model: document.getElementById("modelsel").value});
    renderModel(r.model || {});
    toast("默认模型已更新");
  } catch(e){ toast("模型切换失败：" + e.message, false); }
}
document.getElementById("modelsel").addEventListener("change", applyModel);
document.getElementById("dashbtn").addEventListener("click",
  () => send("chat.launch", {target: "dashboard"}).catch(e => toast(e.message, false)));
document.getElementById("monbtn").addEventListener("click",
  () => send("chat.launch", {target: "monitor"}).catch(e => toast(e.message, false)));
document.getElementById("setbtn").addEventListener("click",
  () => send("chat.launch", {target: "settings"}).catch(e => toast(e.message, false)));
addSystem("聊天已就绪。普通消息走大模型对话；/命令直接指派工具步骤。");
post({kind:"hello", protocol:1, protocol_name:"dclawos-bridge", surface:"chat"});
