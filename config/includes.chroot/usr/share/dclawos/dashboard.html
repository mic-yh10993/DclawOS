<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 看板</title>
<style>
/* Phase 6 M4 dashboard page. The 10 iron rules are executed
   verbatim in their native web form (docs/UI-RULES.md):
   1 no borders, 1-3% lightness layers, palette tokens below, no
     pure black anywhere;
   2 focus: no outline, deepened double-ring box-shadow;
   3 dark: font weights -40 (400->360, 600->560);
   4 streaming text: llm delta rows reveal with the 90ms
     blur(6px) -> clear keyframe, cubic-bezier(.215,.61,.355,1),
     neighbours staggered by 30ms (see .rv below);
   5 inline icons vertical-align:-0.125em;
   6 tabular-nums for every number; 7 Grid 0fr->1fr fold for the
     takeover banner; 8 text-wrap:pretty;
   9 overdamped settle transitions + underdamped success pulse;
   10 feedback self-extinguishes after 2.5s (toast timer). */
:root{
  --layer0:#f5f5f3; --layer1:#fcfcfb; --layer2:#fcfcfb; --layer3:#f5f5f3;
  --ink:#1a1a19; --ink-dim:rgba(32,32,30,.65); --accent:#3d5a80;
  --ring:rgba(61,90,128,.28); --ok:#2e7d4f; --bad:#b3402e;
  --warn:#9a6a12; --tier2:#8c2f1d;
  --hairline:rgba(26,26,25,.08);
}
body.dark{
  --layer0:#0b0b0a; --layer1:#151515; --layer2:#1a1a19; --layer3:#20201e;
  --ink:#f5f5f3; --ink-dim:rgba(245,245,243,.65);
  --hairline:rgba(245,245,243,.09);
  font-weight:360;
}
body.dark h1,body.dark h2,body.dark button,body.dark .count b{font-weight:560}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--layer0); color:var(--ink);
  font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;
  font-size:14px; line-height:1.55; display:flex; flex-direction:column;
}
h1{font-size:17px;font-weight:600;margin:0}
p,.prose{text-wrap:pretty;max-width:68ch}
.dim{color:var(--ink-dim)} .small{font-size:12.5px}
.num,.numeric{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
svg.ic,.ic{vertical-align:-0.125em;width:1em;height:1em;display:inline-block}
button{
  background:var(--layer3); color:var(--ink); border:none; border-radius:8px;
  padding:6px 12px; font:inherit; font-weight:600; cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--hairline);
  transition:transform .18s cubic-bezier(.215,.61,.355,1), opacity .25s cubic-bezier(.215,.61,.355,1);
}
button.primary{background:var(--accent);color:#fcfcfb}
button.danger{background:var(--bad);color:#fcfcfb}
button:disabled{opacity:.45;cursor:default}
button:focus{
  outline:none;
  box-shadow:inset 0 0 0 1px var(--accent), 0 0 0 3px var(--ring);
}
header.dashhead{
  background:var(--layer1); padding:10px 16px; display:flex;
  align-items:center; gap:10px; flex-wrap:wrap;
  box-shadow:inset 0 -1px var(--hairline);
}
header.dashhead .spacer{flex:1 1 auto}
#agentstate{font-weight:600}
#agentstate .dot{
  display:inline-block; width:.62em; height:.62em; border-radius:50%;
  background:var(--ink-dim); vertical-align:-0.125em; margin-right:.4em;
}
#agentstate.thinking .dot{background:var(--accent)}
#agentstate.approval .dot{background:var(--warn)}
#agentstate.attention .dot{background:var(--bad)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
#agentstate.approval .dot,#agentstate.attention .dot{
  animation:breathe 1.6s cubic-bezier(.215,.61,.355,1) infinite}
#counts{
  display:flex; gap:10px; flex-wrap:wrap; padding:10px 16px;
  background:var(--layer1); box-shadow:inset 0 -1px var(--hairline);
}
.count{
  background:var(--layer2); border-radius:10px; padding:6px 14px;
  box-shadow:inset 0 0 0 1px var(--hairline); min-width:96px;
}
.count b{font-size:19px; font-weight:600; display:block}
.count span{font-size:12px; color:var(--ink-dim)}
.fold{display:grid; grid-template-rows:0fr;
  transition:grid-template-rows .25s cubic-bezier(.215,.61,.355,1)}
.fold.open{grid-template-rows:1fr}
.fold > .foldinner{overflow:hidden; min-height:0}
#takeoverbar{
  background:var(--layer2); padding:10px 16px; cursor:pointer;
  box-shadow:inset 0 -1px var(--hairline); font-weight:600;
}
#takeoverbar .n{color:var(--bad)}
#timeline{flex:1 1 auto; overflow-y:auto; padding:10px 16px}
.row{
  display:flex; gap:10px; align-items:baseline; padding:5px 10px;
  margin:0 0 4px; border-radius:8px; background:var(--layer1);
  box-shadow:inset 0 0 0 1px var(--hairline); text-wrap:pretty;
}
.row .ts{flex:0 0 64px; color:var(--ink-dim); font-size:12.5px}
.row .kind{flex:0 0 52px; font-size:12.5px; font-weight:600}
.row .sum{flex:1 1 auto; white-space:pre-wrap; word-break:break-word}
.row .sess{flex:0 0 auto; color:var(--ink-dim); font-size:12px}
.row.t-command .kind{color:var(--accent)}
.row.t-output .kind{color:var(--ink-dim)}
.row.t-approval .kind{color:var(--warn)}
.row.t-takeover .kind{color:var(--bad)}
.row.t-llm .kind{color:var(--accent)}
.row.failed .sum{color:var(--bad)}
@keyframes reveal{
  from{filter:blur(6px); opacity:.25}
  to{filter:blur(0); opacity:1}
}
.rv{animation:reveal 90ms cubic-bezier(.215,.61,.355,1) both}
#overlay{
  position:fixed; inset:0; display:none; align-items:center;
  justify-content:center; background:rgba(11,11,10,.42); z-index:20;
}
#overlay.show{display:flex}
.card{
  background:var(--layer3); color:var(--ink); border-radius:14px;
  padding:0 0 16px; width:min(560px,92vw); max-height:86vh;
  overflow-y:auto; box-shadow:0 12px 40px rgba(26,26,25,.25);
}
.card .riskband{height:8px; border-radius:14px 14px 0 0; background:var(--warn)}
.card.tier2 .riskband{background:var(--tier2)}
.card.tier0 .riskband{background:var(--ok)}
.card .body{padding:14px 18px 0}
.card h2{font-size:16px; margin:0 0 6px}
.card pre{
  margin:8px 0; white-space:pre-wrap; font-size:12.5px;
  background:var(--layer2); border-radius:8px; padding:8px 10px;
  font-variant-numeric:tabular-nums; max-height:200px; overflow-y:auto;
}
.card .actions{display:flex; gap:8px; padding:12px 18px 0}
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--layer3); color:var(--ink); padding:8px 18px;
  border-radius:99px; opacity:0; pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--hairline), 0 6px 24px rgba(26,26,25,.18);
  transition:opacity .25s cubic-bezier(.215,.61,.355,1);
  max-width:86vw; text-wrap:pretty; z-index:30;
}
#toast.show{opacity:1}
#toast.pulse{animation:pulse .38s cubic-bezier(.34,1.8,.64,1)}
@keyframes pulse{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1)}}
.err{color:var(--bad)} .ok{color:var(--ok)}
</style>
</head>
<body>
<header class="dashhead">
  <h1>AI 看板</h1>
  <span id="agentstate" class="idle"><span class="dot"></span><span class="txt">空闲</span></span>
  <span id="connstate" class="small dim">正在连接宿主…</span>
  <span class="spacer"></span>
  <button id="monbtn" type="button">监视 AI</button>
  <button id="chatbtn" type="button">聊天</button>
  <button id="setbtn" type="button">设置</button>
  <button id="editbtn" type="button">编辑器</button>
</header>
<div id="counts">
  <div class="count"><b class="num" id="c-running">0</b><span>运行中</span></div>
  <div class="count"><b class="num" id="c-waiting">0</b><span>等待</span></div>
  <div class="count"><b class="num" id="c-done">0</b><span>完成</span></div>
  <div class="count"><b class="num" id="c-failed">0</b><span>失败</span></div>
  <div class="count"><b class="num" id="c-tokens">0</b><span>tokens（总）</span></div>
  <div class="count"><b class="num" id="c-cost">—</b><span>已知成本 USD</span></div>
  <div class="count"><b class="num" id="c-unknown">0</b><span>未知成本调用</span></div>
</div>
<div class="fold" id="takeoverfold"><div class="foldinner">
  <div id="takeoverbar" role="button" tabindex="0"></div>
</div></div>
<div id="timeline"></div>
<div id="overlay"><div class="card" id="apprcard">
  <div class="riskband"></div>
  <div class="body">
    <h2>审批请求 · <span class="toolname"></span></h2>
    <div class="small dim">风险等级 tier <span class="tiernum num"></span> · 票据 <span class="tid num"></span></div>
    <p class="sum prose"></p>
    <pre class="params"></pre>
    <div class="small dim">参数已由宿主打码；批准只对这一张票据的这一个操作生效。</div>
  </div>
  <div class="actions">
    <button type="button" class="primary" id="appr-ok">批准</button>
    <button type="button" class="danger" id="appr-deny">拒绝</button>
    <span class="small dim" id="appr-queue"></span>
  </div>
</div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* Host bridge: the page is untrusted content; it only sends typed
   command envelopes and receives replies/events. No eval. */
const pending = new Map();
let seq = 0;
function post(obj){
  const text = JSON.stringify(obj);
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dclawos){
    window.webkit.messageHandlers.dclawos.postMessage(text);
  } else if (window.__dclawosHostPost){
    window.__dclawosHostPost(text);
  }
}
function send(command, params){
  return new Promise((resolve, reject) => {
    const id = "r" + (++seq);
    pending.set(id, {resolve, reject});
    post({kind:"command", protocol:1, id:id, command:command, params:params||{}});
  });
}
let toastTimer = null;
function toast(text, ok){
  const el = document.getElementById("toast");
  el.textContent = (ok === false ? "✗ " : "✓ ") + text;
  el.classList.add("show");
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 2500);
}

const KIND_LABEL = {command:"命令", output:"输出", file:"文件",
  tokens:"tokens", model:"模型", approval:"审批", takeover:"接管",
  system:"系统", llm:"模型", task:"任务", settings:"设置"};
const KIND_ICON = {command:"▶", output:"≡", file:"✎", approval:"⚠",
  takeover:"✋", system:"●", llm:"✦", task:"▣", model:"✦", settings:"⚙"};
const timeline = document.getElementById("timeline");
const seenKeys = new Set();
let rendered = 0;
const MAX_ROWS = 500;

function eventKey(ev){
  if (ev && ev.id) return "id:" + ev.id;
  return "fp:" + JSON.stringify([ev && ev.ts, ev && ev.type,
    ev && ev.summary, ev && ev.session, ev && ev.task_id]);
}
function fmtTime(ts){
  const d = new Date((Number(ts) || 0) * 1000);
  const p = n => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
/* Iron rule 4 reveal for streamed llm text: only the delta span
   animates (90ms blur reveal, 30ms stagger cycled per 24 chars). */
function revealSpan(text){
  const wrap = document.createElement("span");
  let i = 0;
  for (const ch of text){
    const s = document.createElement("span");
    s.className = "rv";
    s.style.animationDelay = ((i % 24) * 30) + "ms";
    s.textContent = ch;
    wrap.appendChild(s);
    i++;
  }
  return wrap;
}
function addRow(ev){
  const key = eventKey(ev);
  if (seenKeys.has(key)) return;
  seenKeys.add(key);
  const row = document.createElement("div");
  row.className = "row t-" + (ev.type || "system");
  const inner = ev.data || {};
  if (inner.returncode != null && Number(inner.returncode) !== 0)
    row.classList.add("failed");
  if ((ev.summary || "").indexOf("failed") >= 0) row.classList.add("failed");
  const ts = document.createElement("span");
  ts.className = "ts num"; ts.textContent = fmtTime(ev.ts);
  const kind = document.createElement("span");
  kind.className = "kind";
  const ic = document.createElement("span");
  ic.className = "ic";
  ic.textContent = (KIND_ICON[ev.type] || "●") + " ";
  kind.appendChild(ic);
  kind.appendChild(document.createTextNode(KIND_LABEL[ev.type] || ev.type || ""));
  const sum = document.createElement("span");
  sum.className = "sum";
  if (ev.type === "llm" && inner.delta) sum.appendChild(revealSpan(inner.delta));
  else sum.textContent = ev.summary || "";
  const sess = document.createElement("span");
  sess.className = "sess num";
  sess.textContent = ev.session ? String(ev.session).slice(0, 6) : "";
  row.appendChild(ts); row.appendChild(kind);
  row.appendChild(sum); row.appendChild(sess);
  timeline.appendChild(row);
  rendered++;
  while (timeline.children.length > MAX_ROWS)
    timeline.removeChild(timeline.firstChild);
  timeline.scrollTop = timeline.scrollHeight;
}
function renderCounts(view){
  if (!view) return;
  const c = view.counts || {};
  document.getElementById("c-running").textContent = c.running || 0;
  document.getElementById("c-waiting").textContent = c.waiting || 0;
  document.getElementById("c-done").textContent = c.done || 0;
  document.getElementById("c-failed").textContent = c.failed || 0;
  const u = view.usage || {};
  document.getElementById("c-tokens").textContent = u.total_tokens || 0;
  /* Known cost only; unknown-cost calls are counted separately
     and a null/unknown cost is never rendered as 0. */
  document.getElementById("c-cost").textContent =
    (u.total_calls || 0) === 0 ? "—" : Number(u.known_cost_usd || 0).toFixed(4);
  document.getElementById("c-unknown").textContent = u.unknown_cost_count || 0;
  const sh = view.shell || {};
  const st = document.getElementById("agentstate");
  st.className = sh.key || "idle";
  st.querySelector(".txt").textContent = sh.label || "空闲";
  renderTakeovers(view.takeovers || []);
  for (const card of view.approvals || []) queueApproval(card);
}
function renderTakeovers(list){
  const fold = document.getElementById("takeoverfold");
  const bar = document.getElementById("takeoverbar");
  if (list.length > 0){
    bar.innerHTML = "";
    const t = document.createElement("span");
    t.textContent = "⚠ AI 需要你帮忙：";
    const n = document.createElement("span");
    n.className = "n num"; n.textContent = list.length;
    bar.appendChild(t); bar.appendChild(n);
    bar.appendChild(document.createTextNode(" 个接管请求待处理（点击处理）"));
    fold.classList.add("open");
  } else {
    fold.classList.remove("open");
  }
}
document.getElementById("takeoverbar").addEventListener("click",
  () => send("dashboard.launch", {target: "takeover"})
    .catch(e => toast("打开接管失败：" + e.message, false)));

/* Approval overlay: a queue of pending cards; the host payload
   already carries the real tool name and redacted params. Only
   approve/deny exist — the ticket model is per-operation and
   has no task-scoped grant to offer (see docs/PHASE6.md M4). */
const apprQueue = [];
let apprCurrent = null;
function queueApproval(card){
  if (!card || !card.ticket_id) return;
  if (card.status && card.status !== "pending"){
    removeApproval(card.ticket_id);
    return;
  }
  if (apprCurrent && apprCurrent.ticket_id === card.ticket_id) return;
  if (apprQueue.some(c => c.ticket_id === card.ticket_id)) return;
  apprQueue.push(card);
  showNextApproval();
}
function removeApproval(ticketId){
  const i = apprQueue.findIndex(c => c.ticket_id === ticketId);
  if (i >= 0) apprQueue.splice(i, 1);
  if (apprCurrent && apprCurrent.ticket_id === ticketId){
    apprCurrent = null;
    document.getElementById("overlay").classList.remove("show");
    showNextApproval();
  }
}
function showNextApproval(){
  if (apprCurrent || apprQueue.length === 0) return;
  apprCurrent = apprQueue.shift();
  const card = document.getElementById("apprcard");
  card.className = "card tier" + (apprCurrent.tier == null ? "1" : apprCurrent.tier);
  card.querySelector(".toolname").textContent = apprCurrent.tool || "";
  card.querySelector(".tiernum").textContent =
    apprCurrent.tier == null ? "?" : apprCurrent.tier;
  card.querySelector(".tid").textContent = apprCurrent.ticket_id;
  card.querySelector(".sum").textContent = apprCurrent.summary || "";
  card.querySelector(".params").textContent =
    JSON.stringify(apprCurrent.params || {}, null, 1).slice(0, 1200);
  document.getElementById("appr-queue").textContent =
    apprQueue.length ? ("还有 " + apprQueue.length + " 个待审批") : "";
  document.getElementById("overlay").classList.add("show");
}
async function verdict(verb, label){
  if (!apprCurrent) return;
  const tid = apprCurrent.ticket_id;
  try {
    await send(verb, {ticket_id: tid});
    toast("票据" + label);
    removeApproval(tid);
  } catch(e){ toast("裁决失败：" + e.message, false); }
}
document.getElementById("appr-ok").addEventListener("click",
  () => verdict("dashboard.approve", "已批准"));
document.getElementById("appr-deny").addEventListener("click",
  () => verdict("dashboard.deny", "已拒绝"));

function applyState(state){
  for (const ev of state.events || []) addRow(ev);
  renderCounts(state);
  for (const card of state.approvals || []) queueApproval(card);
}
window.__dclawosReceive = function(msg){
  if (!msg || typeof msg !== "object") return;
  if (msg.kind === "hello_ack"){
    document.getElementById("connstate").textContent =
      "宿主桥已连接（协议 v" + msg.protocol + "）";
    send("dashboard.state", {})
      .then(applyState)
      .catch(e => toast("加载失败：" + e.message, false));
    return;
  }
  if (msg.kind === "reply" || msg.kind === "error"){
    const p = pending.get(msg.id);
    if (!p) return;
    pending.delete(msg.id);
    if (msg.kind === "error") p.reject(new Error((msg.error && msg.error.message) || "宿主错误"));
    else p.resolve(msg.result || {});
    return;
  }
  if (msg.kind === "event"){
    const d = msg.data || {};
    if (msg.type === "dashboard.counts"){ renderCounts(d); return; }
    if (msg.type === "approval.card"){ queueApproval(d); return; }
    if (msg.type === "settings"){
      send("dashboard.state", {}).then(applyState).catch(() => {});
      return;
    }
    addRow(d);
  }
};
document.getElementById("monbtn").addEventListener("click",
  () => send("dashboard.launch", {target: "monitor"}).catch(e => toast(e.message, false)));
document.getElementById("chatbtn").addEventListener("click",
  () => send("dashboard.launch", {target: "chat"}).catch(e => toast(e.message, false)));
document.getElementById("setbtn").addEventListener("click",
  () => send("dashboard.launch", {target: "settings"}).catch(e => toast(e.message, false)));
document.getElementById("editbtn").addEventListener("click",
  () => send("dashboard.launch", {target: "editor"}).catch(e => toast(e.message, false)));
post({kind:"hello", protocol:1, protocol_name:"dclawos-bridge", surface:"dashboard"});
</script>
</body>
</html>
